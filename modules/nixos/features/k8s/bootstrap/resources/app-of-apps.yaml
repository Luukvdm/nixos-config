apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: home
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  source:
    repoURL: git@github.com:Luukvdm/infra.git
    targetRevision: main
    path: app-of-apps
    helm:
      valueFiles:
      - values.yaml
      - values-base.yaml
      valuesObject:
        project: home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  revisionHistoryLimit: 3
